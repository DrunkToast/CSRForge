name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Full regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Install CSRForge and check CLI
        run: |
          python -m pip install .
          csrforge --version

      - name: Run parser, IR, checker, and generator tests
        run: make python-test

      - name: Lint and simulate hand-written Golden RTL
        run: make lint sim

      - name: Verify generated RTL and generated testbench
        run: make generated-check

      - name: Verify public examples end to end
        run: make examples-verify
